server {
    listen 80;
    server_name _;

    # ==================== 主界面（模块5前端） ====================
    location / {
        root /opt/frontend/zhineng_shuifei;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ==================== 模块5 API ====================
    location /api/zonglan    { proxy_pass http://127.0.0.1:5050; }
    location /api/jichu      { proxy_pass http://127.0.0.1:5050; }
    location /api/shebei     { proxy_pass http://127.0.0.1:5050; }
    location /api/tianqi     { proxy_pass http://127.0.0.1:5050; }
    location /api/baogao     { proxy_pass http://127.0.0.1:5050; }
    location /api/xitong     { proxy_pass http://127.0.0.1:5050; }
    location /api/shuju      { proxy_pass http://127.0.0.1:5050; }
    location /api/denglu     { proxy_pass http://127.0.0.1:5050; }
    location /api/juece      { proxy_pass http://127.0.0.1:5050; }
    location /api/yuce       { proxy_pass http://127.0.0.1:5050; }
    location /api/fankui     { proxy_pass http://127.0.0.1:5050; }

    # ==================== 模块1 API（登录首页协同） ====================
    location /api/denglu/yonghu  { proxy_pass http://127.0.0.1:5010; }
    location /api/xietong        { proxy_pass http://127.0.0.1:5010; }

    # ==================== 模块2 API（农业管理平台） ====================
    location /api/zuowuguanli       { proxy_pass http://127.0.0.1:5002; }
    location /api/turangcanshuguanli { proxy_pass http://127.0.0.1:5002; }
    location /api/shebeixinxiguanli  { proxy_pass http://127.0.0.1:5002; }
    location /api/feiliaoxinxiguanli { proxy_pass http://127.0.0.1:5002; }
    location /api/daoru_soil        { proxy_pass http://127.0.0.1:5002; }
    location /api/jiance            { proxy_pass http://127.0.0.1:5001; }

    # ==================== 模块3 API（系统报表天气） ====================
    location /api/health              { proxy_pass http://127.0.0.1:5030; }
    location /api/tianqifenxi         { proxy_pass http://127.0.0.1:5030; }
    location /api/baogaozhongxin      { proxy_pass http://127.0.0.1:5030; }
    location /api/xitongguanli        { proxy_pass http://127.0.0.1:5030; }

    # ==================== 模块4 API（预测分析水肥决策） ====================
    location /api/yucefenxi           { proxy_pass http://127.0.0.1:5041; }
    location /api/shuifeijuece        { proxy_pass http://127.0.0.1:5041; }

    # ==================== 前端静态资源 ====================
    # 模块2前端（原生HTML）
    location /nongye/ {
        alias /opt/frontend/nongyeguanlipingtai/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 模块1前端（Vue构建产物，从OBS或本地dist提供）
    location /shouye/ {
        alias /opt/frontend/shouye/;
        try_files $uri $uri/ /index.html;
    }
    location /denglu-page/ {
        alias /opt/frontend/denglu/;
        try_files $uri $uri/ /index.html;
    }
    location /xietong/ {
        alias /opt/frontend/xietong/;
        try_files $uri $uri/ /index.html;
    }

    # 模块3前端（Vue构建产物）
    location /report/ {
        alias /opt/frontend/report/;
        try_files $uri $uri/ /index.html;
    }

    # 模块4前端（Vue构建产物）
    location /yuce/ {
        alias /opt/frontend/yuce/;
        try_files $uri $uri/ /index.html;
    }

    # ==================== 通用代理设置 ====================
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# ==================== HTTPS配置（可选，需SSL证书） ====================
