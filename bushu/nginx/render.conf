server {
  listen 10000;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location /nongye/ { try_files $uri $uri/ /nongye/index.html; }
  location /api/denglu/ { proxy_pass http://huiguan-login:10000; include /etc/nginx/proxy_params; }
